name: Import Nimforum

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Get importer workflow
        uses: actions/checkout@v7

      - name: Download upstream source archive
        run: |
          mkdir upstream
          curl -L --fail --retry 3 https://codeload.github.com/nim-lang/nimforum/tar.gz/refs/heads/master \
            | tar -xz --strip-components=1 -C upstream

      - name: Preserve importer and add attribution
        run: |
          mkdir -p upstream/.github/workflows
          rm -f upstream/.github/workflows/main.yml
          cp .github/workflows/import-nimforum.yml upstream/.github/workflows/import-nimforum.yml
          cat >> upstream/README.md <<'EOF'

          ---

          ## Amin4601 portfolio mirror

          This repository contains an imported source snapshot of [Nimforum](https://github.com/nim-lang/nimforum), originally developed by the Nim community.
          The upstream `license.txt` is preserved in this repository. Please refer to it for the applicable license terms.

          This is an independently maintained portfolio mirror by Amin4601. It is not a claim of original authorship; credit remains with the upstream project contributors.
          EOF

      - name: Create clean Git history and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd upstream
          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Nimforum with upstream attribution"
          git remote add destination "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c http.version=HTTP/1.1 push destination HEAD:main --force
